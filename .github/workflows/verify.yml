name: verify-public-site

on:
  pull_request:
  push:
    branches: [main, feature/hermes-floorplan-render-e2e]

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript contracts
        run: |
          node --check config.js
          node --check journey-api.js
          node --check journey-intake-policy.js
          node --check journey-geometry-ops.js
          node --check journey-service-workflow.js
          node --check journey-model-artifacts.js
          node --check journey-release-dossier.js
          node --check private-design-selection-workflow.js
          node --check journey-topology-gate.js
          node --check project-journey-model.js
          node --check project-journey.js
          node --check assistant-llm.js
          node --check editor.js
          node --check three-d-stage.js
          node --test tests/*.test.mjs
      - name: Inline module syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          targets = tuple((name, r'<script\b(?=[^>]*\bdata-dc-script\b)[^>]*>(.*?)</script\s*>', '.js') for name in (
              'Home AI.dc.html',
              'AboutUs.dc.html',
              'FaqAndHelp.dc.html',
              'Home Redesign.dc.html',
              'Legal.dc.html',
          ))
          for name, pattern, suffix in targets:
              source = Path(name).read_text()
              scripts = re.findall(pattern, source, re.I | re.S)
              if not scripts:
                  raise RuntimeError(f'No expected inline script found in {name}')
              for index, script in enumerate(scripts):
                  target = Path('/tmp') / f'{name.replace(".", "-")}-{index}{suffix}'
                  target.write_text(script)
                  subprocess.run(['node', '--check', str(target)], check=True)
          PY
      - name: Browser review contracts
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hnm-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          browser_bin="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser_bin"
          server_ready=false
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/tests/project-journey-lifecycle.browser.html >/dev/null; then
              server_ready=true
              break
            fi
            sleep 0.1
          done
          test "$server_ready" = true
          for fixture in project-journey-lifecycle.browser.html project-journey-model-reference.browser.html project-journey-release-dossier.browser.html; do
            result="/tmp/hnm-browser-${fixture//[^A-Za-z0-9]/-}.html"
            "$browser_bin" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom \
              "http://127.0.0.1:4173/tests/$fixture" >"$result"
            grep -q 'data-result="pass"' "$result"
          done
          for viewport in 1440,1000 500,844; do
            result="/tmp/hnm-private-design-selection-${viewport//,/-}.html"
            "$browser_bin" --headless --no-sandbox --disable-gpu --window-size="$viewport" \
              --virtual-time-budget=8000 --dump-dom \
              "http://127.0.0.1:4173/tests/private-design-selection-workflow.browser.html" >"$result"
            grep -q 'data-result="pass"' "$result"
          done
      - name: Reject backend files from public Pages source
        run: |
          if git ls-files | grep -E '\.(aspx|ashx|asmx|cs|config)$|^App_Code/|^App_Data/' ; then
            echo 'Server/backend files must not be published from this repository.' >&2
            exit 1
          fi
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          extra_args: --results=verified,unknown
