<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home &amp; Me - walk the flat (rendered 360 tour)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  .top { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,.5); font-size: 13px; padding: 8px 12px; border-radius: 8px; max-width: 60vw; backdrop-filter: blur(6px); }
  .top b { display: block; font-size: 14px; margin-bottom: 2px; }
  .hud { position: fixed; left: 12px; bottom: 12px; background: rgba(0,0,0,.5); font-size: 12px; padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  .rooms { position: fixed; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .rooms button { border: 0; background: rgba(255,255,255,.9); color: #111; border-radius: 999px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .rooms button[aria-current="true"] { background: #111; color: #fff; }
  .joy { position: fixed; right: 18px; bottom: 18px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.4); touch-action: none; display: none; }
  .joy span { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.85); }
  @media (pointer: coarse) { .joy { display: block; } }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #111; font-size: 14px; transition: opacity .4s; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="load">loading the flat...</div>
<div class="top"><b>Walk the flat</b>Drag to look around. Tap a ring on the floor (or press W) to walk there. Every view is the engine's own render.</div>
<div class="rooms" id="rooms"></div>
<div class="hud" id="hud"></div>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const base = new URLSearchParams(location.search).get('tour') || 'tour/';
const TOUR = await fetch(base + 'tour.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
const hud = document.getElementById('hud'), loadEl = document.getElementById('load');
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.03, 100);
camera.up.set(0, 0, 1);

// --- the proxy mesh wearing two projected 360s (A = where you stand, B = where you are going) ---
const uniforms = {
  panoA: { value: null }, centerA: { value: new THREE.Vector3() },
  panoB: { value: null }, centerB: { value: new THREE.Vector3() },
  mixAB: { value: 0 }, headA: { value: Math.PI / 2 }, headB: { value: Math.PI / 2 }
};
const PROJ = new THREE.ShaderMaterial({
  uniforms, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    uniform sampler2D panoA, panoB; uniform vec3 centerA, centerB; uniform float mixAB, headA, headB; varying vec3 vW;
    const float PI = 3.14159265358979;
    // Blender equirect rendered with the camera level and facing +Y at the image centre; u grows to the camera's right
    vec2 eq(vec3 d, float head){ float phi = atan(d.y, d.x) - head; float u = 0.5 - phi/(2.0*PI); float v = 0.5 + asin(clamp(d.z,-1.0,1.0))/PI; return vec2(fract(u), v); }
    void main(){
      vec3 a = texture2D(panoA, eq(normalize(vW - centerA), headA)).rgb;
      vec3 b = mixAB > 0.0 ? texture2D(panoB, eq(normalize(vW - centerB), headB)).rgb : a;
      gl_FragColor = vec4(mix(a, b, mixAB), 1.0);
    }`
});
PROJ.toneMapped = false;
const texLoader = new THREE.TextureLoader(); const texCache = new Map();
function pano(spot) {
  if (!texCache.has(spot.id)) texCache.set(spot.id, new Promise(res => texLoader.load(base + spot.pano, t => { t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t); })));
  return texCache.get(spot.id);
}

const world = new THREE.Group(); world.rotation.x = Math.PI / 2; scene.add(world);   // glTF Y-up -> Blender Z-up
await new Promise((res, rej) => new GLTFLoader().load(base + TOUR.proxy.file, g => { g.scene.traverse(o => { if (o.isMesh) o.material = PROJ; }); world.add(g.scene); res(); }, undefined, rej));
// a big sphere behind everything so gaps in the proxy still show the 360
const sky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), PROJ); scene.add(sky);

// --- stand at a spot, look around; tap a ring (or press W) to walk to the next spot with a fly-through ---
const spots = TOUR.spots; const byId = Object.fromEntries(spots.map(s => [s.id, s]));
let cur = spots.find(s => s.room === 'living_dining') || spots[0];
let yaw = Math.PI / 2, pitch = 0;
function aim() { camera.lookAt(camera.position.x + Math.cos(yaw) * Math.cos(pitch), camera.position.y + Math.sin(yaw) * Math.cos(pitch), camera.position.z + Math.sin(pitch)); }
const rings = new THREE.Group(); scene.add(rings);
const ringGeo = new THREE.RingGeometry(0.11, 0.16, 48); const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthTest: false });
function rebuildRings() {
  rings.clear();
  for (const id of cur.links) { const s = byId[id]; const m = new THREE.Mesh(ringGeo, ringMat); m.position.set(s.pos[0], s.pos[1], 0.02); m.userData.spot = s; m.renderOrder = 10; rings.add(m); pano(s); }
}
const ROOM_NAMES = { living_dining: 'Living / dining', kitchen: 'Kitchen', bedroom_2: 'Bedroom 2', bedroom_3: 'Bedroom 3', bedroom_4: 'Bedroom 4', bath_wc_1: 'Bathroom 1', bath_wc_1_2: 'Bathroom 2', service_yard: 'Service yard' };
const roomsEl = document.getElementById('rooms');
async function standAt(spot) {
  uniforms.panoA.value = await pano(spot); uniforms.centerA.value.set(...spot.pos); uniforms.headA.value = spot.heading ?? Math.PI / 2; uniforms.mixAB.value = 0;
  camera.position.set(...spot.pos); cur = spot; rebuildRings();
  hud.textContent = ROOM_NAMES[spot.room] || spot.room; roomsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.room === cur.room));
}
let moving = false;
async function walkTo(spot) {
  if (moving || spot === cur) return; moving = true;
  const tB = await pano(spot); uniforms.panoB.value = tB; uniforms.centerB.value.set(...spot.pos); uniforms.headB.value = spot.heading ?? Math.PI / 2;
  const from = camera.position.clone(), to = new THREE.Vector3(...spot.pos); const t0 = performance.now(), D = 700;
  await new Promise(res => { (function step() { const k = Math.min(1, (performance.now() - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; camera.position.lerpVectors(from, to, e); uniforms.mixAB.value = e; if (k < 1) requestAnimationFrame(step); else res(); })(); });
  await standAt(spot); moving = false;
}
for (const r of [...new Set(spots.map(s => s.room))]) { const b = document.createElement('button'); b.textContent = ROOM_NAMES[r] || r; b.dataset.room = r; b.onclick = () => { const s = spots.find(x => x.room === r); if (cur.links.includes(s.id)) walkTo(s); else standAt(s); }; roomsEl.appendChild(b); }

// --- input: drag to look (drag up = look up), tap a ring to walk, W/S step to the spot ahead/behind, A/D turn ---
let look = null, moved = 0;
canvas.addEventListener('pointerdown', e => { look = { x: e.clientX, y: e.clientY, id: e.pointerId }; moved = 0; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; });
canvas.addEventListener('pointermove', e => { if (!look || e.pointerId !== look.id) return; const dx = e.clientX - look.x, dy = e.clientY - look.y; moved += Math.abs(dx) + Math.abs(dy); yaw -= dx * 0.0035; pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.0035)); look.x = e.clientX; look.y = e.clientY; });
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2();
canvas.addEventListener('pointerup', e => {
  if (!look || e.pointerId !== look.id) return; look = null; canvas.style.cursor = 'grab';
  if (moved > 8) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(rings.children, false)[0];
  if (hit) return walkTo(hit.object.userData.spot);
  const floorHit = ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), new THREE.Vector3());
  if (floorHit) { let best = null, bd = 1e9; for (const id of cur.links) { const s = byId[id]; const d = Math.hypot(s.pos[0] - floorHit.x, s.pos[1] - floorHit.y); if (d < bd) { bd = d; best = s; } } if (best && bd < 2.5) walkTo(best); }
});
function stepTo(sign) { const f = new THREE.Vector2(Math.cos(yaw) * sign, Math.sin(yaw) * sign); let best = null, bs = 0.4; for (const id of cur.links) { const s = byId[id]; const d = new THREE.Vector2(s.pos[0] - cur.pos[0], s.pos[1] - cur.pos[1]); const sc = d.normalize().dot(f); if (sc > bs) { bs = sc; best = s; } } if (best) walkTo(best); }
addEventListener('keydown', e => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') { e.preventDefault(); stepTo(1); }
  if (e.code === 'KeyS' || e.code === 'ArrowDown') { e.preventDefault(); stepTo(-1); }
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') yaw += 0.12; if (e.code === 'ArrowRight' || e.code === 'KeyD') yaw -= 0.12;
});
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
await standAt(cur);
loadEl.style.opacity = 0; setTimeout(() => loadEl.remove(), 500);
renderer.setAnimationLoop(() => { aim(); renderer.render(scene, camera); });
window.__tour = { walkTo, standAt, spots, camera, get cur() { return cur; } };
</script>
</body>
</html>
