<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Project Journey correction URL lifecycle</title>
</head>
<body data-result="running">
  <main id="fixture"></main>
  <script type="module">
    import { ProjectJourneyApp } from '../project-journey.js';
    import { WorkflowPhase } from '../journey-service-workflow.js';

    const revoked = [];
    URL.revokeObjectURL = (url) => revoked.push(url);
    const previewUrl = 'blob:ephemeral-preview';
    const sourceUrl = 'blob:verified-source-plan';
    const app = Object.create(ProjectJourneyApp.prototype);
    Object.assign(app, {
      busy: false,
      objectUrls: [previewUrl],
      pendingCorrection: { imageUrl: sourceUrl },
      previewEpoch: 0,
      state: { phase: WorkflowPhase.GEOMETRY_REVIEW },
      phaseData: { geometry: { geometry: {} } },
      workbench: document.querySelector('#fixture'),
      capabilityEnabled: () => true,
    });

    app.renderCorrectionEvidence = () => {
      const image = document.createElement('img');
      image.alt = 'Verified correction source lifecycle witness';
      image.dataset.sourceUrl = app.pendingCorrection.imageUrl;
      app.workbench.replaceChildren(image);
      if (revoked.includes(sourceUrl)) throw new Error('Correction source was revoked before its first evidence render.');
    };

    try {
      app.renderWorkspace({ availability: { live: true } });
      if (app.workbench.querySelector('img')?.dataset.sourceUrl !== sourceUrl) throw new Error('Evidence image was not rendered.');
      if (revoked.join(',') !== previewUrl) throw new Error('Workspace render released the wrong object URL.');
      app.clearPendingCorrection();
      if (revoked.join(',') !== `${previewUrl},${sourceUrl}`) throw new Error('Explicit cleanup did not release the correction source.');
      document.body.dataset.result = 'pass';
    } catch (error) {
      document.body.dataset.result = 'fail';
      document.body.textContent = error.stack || error.message;
    }
  </script>
</body>
</html>
