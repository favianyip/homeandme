<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source-registered editor browser fixture</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}</style>
</head>
<body>
  <iframe id="editor" src="../editor.html?mode=service" title="Source registration smoke fixture"></iframe>
  <script type="module">
    import { registrationIntegritySha256 } from '../journey-source-registration.js';

    const geometrySha256 = 'a'.repeat(64);
    const sourceSha256 = 'b'.repeat(64);
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 500;
    const context = canvas.getContext('2d');
    context.fillStyle = '#fffdf7'; context.fillRect(0, 0, 600, 500);
    context.strokeStyle = '#343a3b'; context.lineWidth = 15; context.lineCap = 'square';
    context.strokeRect(50, 50, 500, 400);
    context.beginPath(); context.moveTo(300, 50); context.lineTo(300, 450); context.stroke();
    context.fillStyle = '#466f7a'; context.fillRect(130, 42, 120, 16);
    context.fillStyle = '#ba5f44'; context.fillRect(405, 442, 90, 16);
    context.fillStyle = '#5d625e'; context.font = '24px serif';
    context.fillText('LIVING', 105, 245); context.fillText('BEDROOM', 345, 245);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
    const imageUrl = URL.createObjectURL(blob);
    const project = {
      schema: 'hnm-project/1', id: 'HNM-SOURCE-SMOKE',
      revision: { number: 1, geometrySha256 },
      storeys: [{ id: 's1', name: 'Level 1', elevation: 0, height: 2800 }],
      geometry: {
        walls: [
          { id: 'north', storeyId: 's1', path: { kind: 'line', start: [0,0], end: [5000,0] }, thickness: 150, height: 2800, confidence: .99 },
          { id: 'east', storeyId: 's1', path: { kind: 'line', start: [5000,0], end: [5000,4000] }, thickness: 150, height: 2800, confidence: .99 },
          { id: 'south', storeyId: 's1', path: { kind: 'line', start: [5000,4000], end: [0,4000] }, thickness: 150, height: 2800, confidence: .99 },
          { id: 'west', storeyId: 's1', path: { kind: 'line', start: [0,4000], end: [0,0] }, thickness: 150, height: 2800, confidence: .99 },
          { id: 'partition', storeyId: 's1', path: { kind: 'line', start: [2500,0], end: [2500,4000] }, thickness: 120, height: 2800, confidence: .72 },
        ],
        openings: [
          { id: 'window', storeyId: 's1', wallId: 'north', kind: 'window', span: { startRatio: .16, endRatio: .4 }, height: 1200, sill: 900, handing: 'none', confidence: .98 },
          { id: 'entry', storeyId: 's1', wallId: 'south', kind: 'door', span: { startRatio: .11, endRatio: .29 }, height: 2100, sill: 0, handing: 'left', confidence: .96 },
        ],
        spaces: [
          { id: 'living', name: 'Living', function: 'living', storeyId: 's1', boundary: [[0,0],[2500,0],[2500,4000],[0,4000]], wallIds: ['north','partition','south','west'], anchor: [1250,2000] },
          { id: 'bedroom', name: 'Bedroom', function: 'bedroom', storeyId: 's1', boundary: [[2500,0],[5000,0],[5000,4000],[2500,4000]], wallIds: ['north','east','south','partition'], anchor: [3750,2000] },
        ],
        columns: [], shafts: [], beams: [],
      },
    };
    const frame = document.getElementById('editor');
    const registrationCore = {
      schema: 'hnm-source-pixel-metric-registration/1',
      sourceArtifactRole: 'original_upload', sourceArtifactSha256: sourceSha256,
      sourceImageSizePx: { width: 600, height: 500 }, geometrySha256,
      pixelToMetric: { a: 10, b: 0, c: 0, d: 10, e: -500, f: -500 },
    };
    const registration = {
      ...registrationCore,
      registrationSha256: await registrationIntegritySha256(registrationCore),
    };
    addEventListener('message', (event) => {
      if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
      if (event.data?.type === 'hnm:editor-ready') frame.contentWindow.postMessage({
        type: 'hnm:editor-load-project', project,
        sourceUnderlay: {
          imageUrl, sourceArtifactSha256: sourceSha256,
          intrinsicPixels: { width: 600, height: 500 }, geometrySha256,
          registration,
        },
      }, location.origin);
    });
  </script>
</body>
</html>
